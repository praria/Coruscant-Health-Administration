{% extends 'base.html' %}

{% block title %}Create Service Order{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white shadow p-6 rounded-lg space-y-6">
    <h1 class="text-2xl font-bold">Create a Service Order</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
            Submit Order
        </button>
    </form>
</div>
{% endblock %}
