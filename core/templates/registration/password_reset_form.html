{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-10 p-6 bg-white shadow-md rounded-xl">
    <h2 class="text-2xl font-bold mb-4 text-center">Reset Your Password</h2>

    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            <label for="id_email" class="block text-sm font-medium text-gray-700 mb-1">
                Enter your email address
            </label>
            <!-- Custom styling for email input -->
            <input 
                type="email" 
                name="email" 
                id="id_email"
                class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" 
                placeholder="example@example.com" 
                required 
            />
            {% if form.email.errors %}
                <div class="text-red-600 text-sm mt-2">
                    {% for error in form.email.errors %}
                        <p>{{ error }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        </div>

        <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded hover:bg-blue-700">
            Send Password Reset Email
        </button>
    </form>
</div>
{% endblock %}
