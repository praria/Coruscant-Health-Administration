{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-10 p-6 bg-white shadow-md rounded-xl">
    <h2 class="text-2xl font-bold mb-4 text-center">Login</h2>
    
    <form method="post">
        {% csrf_token %}
        {% if form.non_field_errors %}
            <div class="mb-4 text-red-600 text-sm">
                {{ form.non_field_errors }}
            </div>
        {% endif %}

        <div class="mb-4">
            <label for="{{ form.username.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">
                {{ form.username.label }}
            </label>
            {{ form.username }}
        </div>

        <div class="mb-4">
            <label for="{{ form.password.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">
                {{ form.password.label }}
            </label>
            {{ form.password }}
        </div>

        <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2 px-4 rounded hover:bg-blue-700">
            Login
        </button>
    </form>
</div>
{% endblock %}
