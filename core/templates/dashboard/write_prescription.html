{% extends 'base.html' %}

{% block title %}Write Prescription{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-4">Write a Prescription</h1>

<form method="post" class="space-y-4 bg-white p-6 rounded-lg shadow">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
        Submit Prescription
    </button>
</form>
{% endblock %}
